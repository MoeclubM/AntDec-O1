<!doctype html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="darkreader-lock">
  <title>AntDec 控制台</title>
  <script>try{document.documentElement.classList.toggle('dark',localStorage.getItem('antdec-theme')!=='light')}catch{}</script>
  <style>html{background:#fff;color-scheme:light}html.dark{background:#141414;color-scheme:dark}</style>
</head>
<body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>
